<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ved Holidays Admin</title><style>:root{--navy:#061b2b;--navy2:#0b3048;--gold:#e8b44b;--gold2:#ffd36f;--bg:#f4f7f9;--line:#dce5ea;--muted:#637887}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#102a3a}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--gold);color:#102a3a;font-weight:900;cursor:pointer}.btn.red{background:#d85d5d;color:#fff}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#173d55,#061b2b 60%)}.loginbox{width:min(430px,92%);background:#fff;padding:34px;border-radius:22px;box-shadow:0 25px 80px #0005}.loginbox img{width:180px;display:block;margin:0 auto 15px}.loginbox h2{text-align:center;font:700 30px Georgia;margin:8px 0 25px}.f{margin:13px 0}.f label{display:block;font-size:11px;font-weight:900;letter-spacing:.6px;margin-bottom:6px}.f input,.f textarea,.f select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}.top{height:78px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#fff}.top img{height:52px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 78px)}aside{background:#09263a;padding:20px 14px}aside button{width:100%;text-align:left;border:0;background:transparent;color:#d8e7ee;padding:13px;border-radius:9px;font-weight:800;cursor:pointer;margin-bottom:5px}aside button:hover{background:#ffffff12;color:#fff}.main{padding:30px;max-width:1400px;width:100%}h1{font:700 38px Georgia;margin:0 0 22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 25px #09263a0d}.stat{font-size:13px;color:var(--muted)}.stat b{display:block;color:#102a3a;font-size:32px;margin-top:8px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.table{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:#f7fafb}.modal{position:fixed;inset:0;background:#061b2bcc;display:none;z-index:30;overflow:auto;padding:20px}.modal.on{display:block}.box{background:#fff;width:min(900px,100%);margin:20px auto;border-radius:18px;padding:25px;position:relative}.close{position:absolute;right:15px;top:10px;font-size:28px;cursor:pointer}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.notice{padding:13px;border-radius:10px;background:#eef6f8;color:#24536a;margin-bottom:15px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:5px}aside button{min-width:max-content;width:auto}.stats{grid-template-columns:1fr 1fr}.main{padding:18px}.grid2{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:520px){.stats{grid-template-columns:1fr}.top{padding:0 14px}.top img{height:45px}.main h1{font-size:30px}}
</style></head><body><div id="A"></div><script>const A=document.getElementById('A');let editing=null,xPhoto='';function loginPage(){A.innerHTML=`<div class="login"><form class="loginbox" onsubmit="login(event)"><img src="/logo.png" onerror="this.src='logo.png'"><h2>Admin Control Panel</h2><div class="f"><label>USERNAME</label><input id="u" value="admin"></div><div class="f"><label>PASSWORD</label><input id="p" type="password" required></div><button class="btn" style="width:100%">Login Securely</button></form></div>`}async function login(e){e.preventDefault();let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)start();else alert('Invalid login')}async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(r.status===401){loginPage();throw Error('login')}return r.json()}function start(){A.innerHTML=`<div class="top"><img src="/logo.png" onerror="this.src='logo.png'"><button class="btn" onclick="logout()">Logout</button></div><div class="layout"><aside><button onclick="dash()">📊 Dashboard</button><button onclick="packs()">📦 Packages & Prices</button><button onclick="countries()">🌍 Countries</button><button onclick="books()">🧾 Bookings</button><button onclick="enqs()">💬 Enquiries</button><button onclick="reviews()">⭐ Reviews</button></aside><main class="main" id="C"></main></div>`;dash()}async function dash(){let d=await api('/api/admin/dashboard');C.innerHTML=`<h1>Dashboard</h1><div class="stats"><div class="stat">Countries<b>${d.countries}</b></div><div class="stat">Packages<b>${d.packages}</b></div><div class="stat">Bookings<b>${d.bookings}</b></div><div class="stat">Enquiries<b>${d.enquiries}</b></div></div><div class="panel" style="margin-top:20px"><div class="notice">Your customer enquiries, bookings and package data are stored through the connected database.</div><button class="btn" onclick="packs();setTimeout(()=>pkgForm(),100)">+ Add Package</button></div>`}async function packs(){let ps=await api('/api/admin/packages');C.innerHTML=`<h1>Packages & Prices</h1><div class="panel"><div class="toolbar"><b>${ps.length} packages</b><button class="btn" onclick="pkgForm()">+ Add Package</button></div><div class="table"><table><tr><th>Package</th><th>Country</th><th>Duration</th><th>Price</th><th>Action</th></tr>${ps.map(p=>`<tr><td><b>${p.title}</b><br><small>${p.short||''}</small></td><td>${p.country}</td><td>${p.duration}</td><td>₹${Number(p.price).toLocaleString('en-IN')} / ${p.unit}</td><td><button class="btn" onclick='pkgForm(${JSON.stringify(p)})'>Edit</button> <button class="btn red" onclick="del(${p.id})">Delete</button></td></tr>`).join('')}</table></div></div>`}function pkgForm(p={}){editing=p.id||null;document.body.insertAdjacentHTML('beforeend',`<div class="modal on" id="M"><div class="box"><span class="close" onclick="M.remove()">×</span><h2>${editing?'Edit':'Add'} Package</h2><div class="grid2"><div class="f"><label>TITLE</label><input id="pt" value="${p.title||''}"></div><div class="f"><label>COUNTRY SLUG</label><input id="pc" value="${p.country||'thailand'}"></div><div class="f"><label>DURATION</label><input id="pd" value="${p.duration||''}"></div><div class="f"><label>PRICE</label><input id="pp" type="number" value="${p.price||''}"></div><div class="f"><label>UNIT</label><input id="pu" value="${p.unit||'per person'}"></div><div class="f"><label>IMAGE PATH</label><input id="pi" value="${p.image||'/thailand-hero.png'}"></div><div class="f full"><label>SHORT DESCRIPTION</label><textarea id="ps" rows="2">${p.short||''}</textarea></div><div class="f full"><label>ITINERARY — ONE DAY PER LINE</label><textarea id="pit" rows="6">${(p.itinerary||[]).join('\n')}</textarea></div><div class="f full"><label>ACCOMMODATION — Day range | Location | Hotel | Room | Meal</label><textarea id="pa" rows="5">${(p.accommodation||[]).map(a=>[a.day,a.location,a.hotel,a.room,a.meal].join(' | ')).join('\n')}</textarea></div><div class="f full"><label>INCLUSIONS — ONE PER LINE</label><textarea id="pin" rows="4">${(p.inclusions||[]).join('\n')}</textarea></div><div class="f full"><label>EXCLUSIONS — ONE PER LINE</label><textarea id="pex" rows="4">${(p.exclusions||[]).join('\n')}</textarea></div></div><button class="btn" onclick="savePkg()">Save Package</button></div></div>`)}async function savePkg(){let lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean),acc=lines(pa.value).map(x=>{let z=x.split('|').map(v=>v.trim());return{day:z[0]||'',location:z[1]||'',hotel:z[2]||'',room:z[3]||'',meal:z[4]||''}});let b={title:pt.value,country:pc.value,duration:pd.value,price:Number(pp.value),unit:pu.value,image:pi.value,short:ps.value,itinerary:lines(pit.value),accommodation:acc,inclusions:lines(pin.value),exclusions:lines(pex.value)};await api(editing?'/api/admin/packages/'+editing:'/api/admin/packages',{method:editing?'PUT':'POST',body:JSON.stringify(b)});M.remove();packs()}async function del(id){if(confirm('Delete package?')){await api('/api/admin/packages/'+id,{method:'DELETE'});packs()}}async function countries(){let cs=await api('/api/admin/countries');C.innerHTML=`<h1>Countries</h1><div class="panel"><div class="toolbar"><b>Manage destinations</b></div><div class="table"><table><tr><th>Country</th><th>Slug</th><th>Status</th></tr>${cs.map(c=>`<tr><td>${c.flag} ${c.name}</td><td>${c.slug}</td><td><b>${c.status}</b></td></tr>`).join('')}</table></div><p style="color:#6c7d87">Country add/edit API is available in the backend; the next admin release can expose full editing controls here.</p></div>`}async function books(){let bs=await api('/api/admin/bookings');C.innerHTML=`<h1>Bookings</h1><div class="panel"><div class="table"><table><tr><th>ID</th><th>Customer</th><th>Package</th><th>Date</th><th>Status</th></tr>${bs.map(b=>`<tr><td><b>${b.bookingId||('VH'+String(b.id).padStart(5,'0'))}</b></td><td>${b.name||''}<br>${b.phone||''}</td><td>${b.package||''}</td><td>${b.date||''}</td><td>${b.status}</td></tr>`).join('')}</table></div></div>`}async function reviews(){let rs=await api('/api/admin/reviews');C.innerHTML=`<h1>Reviews</h1><div class="panel"><div class="toolbar"><b>Verified customer reviews</b><button class="btn" onclick="reviewForm()">+ Add Review</button></div><div class="table"><table><tr><th>Name</th><th>Country</th><th>Rating</th><th>Review</th><th>Trip Photo</th><th>Published</th><th>Action</th></tr>${rs.map(x=>`<tr><td><b>${x.name||''}</b></td><td>${x.country||''}</td><td>${x.rating||5}/5</td><td>${x.text||''}</td><td>${x.photo?`<img src="${x.photo}" style="width:70px;height:50px;object-fit:cover;border-radius:7px">`:'—'}</td><td>${x.published!==false?'Yes':'No'}</td><td><button class="btn" onclick='reviewForm(${JSON.stringify(x)})'>Edit</button> <button class="btn red" onclick="delReview(${x.id})">Delete</button></td></tr>`).join('')}</table></div></div>`}function reviewForm(x={}){editing=x.id||null;xPhoto=x.photo||'';document.body.insertAdjacentHTML('beforeend',`<div class="modal on" id="RM"><div class="box"><span class="close" onclick="RM.remove()">×</span><h2>${editing?'Edit':'Add'} Review</h2><div class="grid2"><div class="f"><label>NAME</label><input id="rn" value="${x.name||''}"></div><div class="f"><label>COUNTRY</label><input id="rc" value="${x.country||'Thailand'}"></div><div class="f"><label>RATING</label><input id="rr" type="number" min=1 max=5 value="${x.rating||5}"></div><div class="f full"><label>TRIP PHOTO (OPTIONAL)</label><input id="rphoto" type="file" accept="image/jpeg,image/png,image/webp"><small style="color:#71808c">For new reviews, choose a photo. Existing photo stays unless replaced.</small></div><div class="f"><label>PUBLISHED</label><select id="rp"><option value="true" ${x.published!==false?'selected':''}>Yes</option><option value="false" ${x.published===false?'selected':''}>No</option></select></div><div class="f full"><label>REVIEW</label><textarea id="rt" rows=5>${x.text||''}</textarea></div></div><button class="btn" onclick="saveReview()">Save Review</button></div></div>`)}async function saveReview(){let photo=xPhoto||'';const file=document.getElementById('rphoto')?.files[0];if(file){if(file.size>2*1024*1024)return alert('Please choose a photo under 2 MB.');photo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read the photo.'));r.readAsDataURL(file)});}let b={name:rn.value,country:rc.value,rating:Number(rr.value),text:rt.value,published:rp.value==='true',verified:true,photo};await api(editing?'/api/admin/reviews/'+editing:'/api/admin/reviews',{method:editing?'PUT':'POST',body:JSON.stringify(b)});RM.remove();reviews()}async function delReview(id){if(confirm('Delete review?')){await api('/api/admin/reviews/'+id,{method:'DELETE'});reviews()}}async function enqs(){let qs=await api('/api/admin/enquiries');C.innerHTML=`<h1>Custom Enquiries</h1><div class="panel"><div class="table"><table><tr><th>Date</th><th>Name</th><th>Phone</th><th>Country</th><th>Message</th></tr>${qs.map(q=>`<tr><td>${new Date(q.createdAt).toLocaleString()}</td><td>${q.name||''}</td><td>${q.phone||''}</td><td>${q.country||''}</td><td>${q.message||''}</td></tr>`).join('')}</table></div></div>`}async function logout(){await fetch('/api/admin/logout',{method:'POST'});loginPage()}fetch('/api/admin/me').then(r=>r.ok?start():loginPage())</script></body></html>
