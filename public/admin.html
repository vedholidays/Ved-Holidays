<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ved Holidays Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f9;color:#173447}.top{height:65px;background:#032d43;display:flex;justify-content:space-between;align-items:center;padding:0 20px}.top img{height:50px}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 65px)}aside{background:#fff;padding:15px;border-right:1px solid #dde6ea}aside button{width:100%;padding:12px;border:0;background:none;text-align:left;border-radius:7px;margin:3px 0;font-weight:700}aside button:hover{background:#eaf5fb}.main{padding:25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.panel,.loginbox,.modalbox{background:#fff;border-radius:12px;padding:20px;box-shadow:0 5px 20px #12344812}.stat b{display:block;font-size:28px;margin-top:5px}.toolbar{display:flex;justify-content:space-between;margin-bottom:15px}.btn{border:0;border-radius:7px;padding:10px 14px;background:#f4b72f;font-weight:900;cursor:pointer}.blue{background:#075b87;color:#fff}.red{background:#d84b4b;color:#fff}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e4ecef;text-align:left;font-size:13px}th{background:#f4f8fa}.login{min-height:100vh;display:grid;place-items:center;background:#032d43}.loginbox{width:min(420px,92%)}.loginbox img{width:220px}.f{margin:12px 0}.f label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.f input,.f textarea,.f select{width:100%;padding:11px;border:1px solid #ccd9df;border-radius:7px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto}.close{float:right;font-size:25px;cursor:pointer}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto}.stats{grid-template-columns:1fr 1fr}.g{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div id="app"></div><script>
const A=document.getElementById('app');let edit=null;
async function api(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});if(r.status===401){loginPage();throw 0}return r.json()}
function loginPage(){A.innerHTML=`<div class="login"><form class="loginbox" onsubmit="login(event)"><img src="/logo.png"><h2>Admin Control Panel</h2><div class="f"><label>USERNAME</label><input id="u" value="admin"></div><div class="f"><label>PASSWORD</label><input id="p" type="password"></div><button class="btn blue" style="width:100%">Login</button></form></div>`}
async function login(e){e.preventDefault();let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)start();else alert('Invalid login')}
async function start(){A.innerHTML=`<div class="top"><img src="/logo.png"><button class="btn" onclick="logout()">Logout</button></div><div class="layout"><aside><button onclick="dash()">📊 Dashboard</button><button onclick="packs()">📦 Packages & Prices</button><button onclick="countries()">🌍 Countries</button><button onclick="books()">🧾 Bookings</button><button onclick="enqs()">💬 Enquiries</button></aside><div class="main" id="C"></div></div>`;dash()}
async function dash(){let d=await api('/api/admin/dashboard');C.innerHTML=`<h1>Dashboard</h1><div class="stats"><div class="stat">Countries<b>${d.countries}</b></div><div class="stat">Packages<b>${d.packages}</b></div><div class="stat">Bookings<b>${d.bookings}</b></div><div class="stat">Enquiries<b>${d.enquiries}</b></div></div><div class="panel" style="margin-top:20px"><button class="btn" onclick="packs();setTimeout(()=>pkgForm(),100)">+ Add Package</button></div>`}
async function packs(){let ps=await api('/api/admin/packages');C.innerHTML=`<h1>Packages & Prices</h1><div class="panel"><div class="toolbar"><b>${ps.length} packages</b><button class="btn" onclick="pkgForm()">+ Add Package</button></div><div class="table"><table><tr><th>Package</th><th>Country</th><th>Duration</th><th>Price</th><th>Action</th></tr>${ps.map(p=>`<tr><td>${p.title}</td><td>${p.country}</td><td>${p.duration}</td><td>₹${Number(p.price).toLocaleString('en-IN')} / ${p.unit}</td><td><button class="btn" onclick='pkgForm(${JSON.stringify(p)})'>Edit</button> <button class="btn red" onclick="del(${p.id})">Delete</button></td></tr>`).join('')}</table></div></div>`}
function pkgForm(p={country:'thailand',title:'',duration:'',price:0,unit:'person',short:'',image:'',itinerary:[],inclusions:[],exclusions:[],accommodation:[]}){
 edit=p.id||null;
 const stays=(p.accommodation||[]).map(a=>[a.day||'',a.location||'',a.hotel||'',a.room||'',a.meal||''].join(' | ')).join('\n');
 document.body.insertAdjacentHTML('beforeend',`<div class="modal on" id="M"><div class="modalbox"><span class="close" onclick="M.remove()">×</span><h2>${edit?'Edit':'Add'} Package</h2><form onsubmit="savePkg(event)"><div class="g"><div class="f"><label>COUNTRY SLUG</label><input id="pc" value="${p.country}"></div><div class="f"><label>TITLE</label><input id="pt" value="${p.title}"></div><div class="f"><label>DURATION</label><input id="pd" value="${p.duration}"></div><div class="f"><label>PRICE ₹</label><input id="pp" type="number" value="${p.price}"></div><div class="f"><label>UNIT</label><select id="pu"><option ${p.unit==='person'?'selected':''}>person</option><option ${p.unit==='couple'?'selected':''}>couple</option></select></div><div class="f"><label>IMAGE URL</label><input id="pi" value="${p.image}"></div><div class="f full"><label>SHORT DESCRIPTION</label><input id="ps" value="${p.short}"></div><div class="f full"><label>ITINERARY — one item per line</label><textarea id="pit" rows="5">${(p.itinerary||[]).join('\n')}</textarea></div><div class="f full"><label>INCLUSIONS — one per line</label><textarea id="pin" rows="3">${(p.inclusions||[]).join('\n')}</textarea></div><div class="f full"><label>EXCLUSIONS — one per line</label><textarea id="pex" rows="3">${(p.exclusions||[]).join('\n')}</textarea></div><div class="f full"><label>🏨 ACCOMMODATION DETAILS — one stay per line</label><textarea id="pacc" rows="6" placeholder="Day 1-2 | Pattaya | 4★ selected hotel in Pattaya | Deluxe Room | Breakfast">${stays}</textarea><small style="display:block;color:#6c7d87;margin-top:5px">Format: Day / Days | Location | Hotel | Room type | Meal plan</small></div></div><button class="btn blue">Save Package</button></form></div></div>`)
}

async function savePkg(e){
 e.preventDefault();
 let accommodation=pacc.value.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{let a=line.split('|').map(x=>x.trim());return{day:a[0]||'',location:a[1]||'',hotel:a[2]||'',room:a[3]||'',meal:a[4]||''}});
 let b={country:pc.value,title:pt.value,duration:pd.value,price:Number(pp.value),unit:pu.value,image:pi.value,short:ps.value,itinerary:pit.value.split('\n').map(x=>x.trim()).filter(Boolean),inclusions:pin.value.split('\n').map(x=>x.trim()).filter(Boolean),exclusions:pex.value.split('\n').map(x=>x.trim()).filter(Boolean),accommodation,active:true,featured:true};
 await api(edit?'/api/admin/packages/'+edit:'/api/admin/packages',{method:edit?'PUT':'POST',body:JSON.stringify(b)});M.remove();packs()
}

async function del(id){if(confirm('Delete package?')){await api('/api/admin/packages/'+id,{method:'DELETE'});packs()}}
async function countries(){let cs=await api('/api/admin/countries');C.innerHTML=`<h1>Countries</h1><div class="panel"><div class="toolbar"><b>Manage destinations</b><button class="btn">Add Country</button></div><table><tr><th>Country</th><th>Slug</th><th>Status</th></tr>${cs.map(c=>`<tr><td>${c.flag} ${c.name}</td><td>${c.slug}</td><td>${c.status}</td></tr>`).join('')}</table><p style="color:#6c7d87">Country add/edit API is included and can be extended in the next admin release.</p></div>`}
async function books(){let bs=await api('/api/admin/bookings');C.innerHTML=`<h1>Bookings</h1><div class="panel"><table><tr><th>ID</th><th>Customer</th><th>Package</th><th>Date</th><th>Status</th></tr>${bs.map(b=>`<tr><td>VH${String(b.id).padStart(5,'0')}</td><td>${b.name||''}<br>${b.phone||''}</td><td>${b.package||''}</td><td>${b.date||''}</td><td>${b.status}</td></tr>`).join('')}</table></div>`}
async function enqs(){let qs=await api('/api/admin/enquiries');C.innerHTML=`<h1>Custom Enquiries</h1><div class="panel"><table><tr><th>Date</th><th>Name</th><th>Phone</th><th>Country</th><th>Message</th></tr>${qs.map(q=>`<tr><td>${new Date(q.createdAt).toLocaleString()}</td><td>${q.name||''}</td><td>${q.phone||''}</td><td>${q.country||''}</td><td>${q.message||''}</td></tr>`).join('')}</table></div>`}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});loginPage()}fetch('/api/admin/me').then(r=>r.ok?start():loginPage())
</script></body></html>
