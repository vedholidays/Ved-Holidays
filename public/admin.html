<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ved Holidays Admin</title><style>
:root{--n:#06223a;--n2:#0a3a5c;--g:#e7b64f;--bg:#f4f8fa;--line:#dce6ec;--muted:#6b7f8c;--red:#c94d5c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#173144}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:var(--n);font-weight:900;cursor:pointer}.btn.dark{background:var(--n);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.gray{background:#e8eef2}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#174766,#06223a 65%)}.loginbox{width:min(430px,92%);background:#fff;padding:34px;border-radius:24px;box-shadow:0 30px 100px #0006}.loginbox img{width:190px;display:block;margin:auto}.loginbox h2{text-align:center;font:700 30px Georgia;color:var(--n)}.field{margin:11px 0}.field label{display:block;font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.7px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;outline:0;font:inherit}.top{height:76px;background:var(--n);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top img{height:52px}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 76px)}aside{background:#082d47;padding:18px 12px}aside button{width:100%;border:0;background:transparent;color:#d8e8f0;text-align:left;padding:12px;border-radius:9px;font-weight:800;margin-bottom:4px;cursor:pointer}aside button:hover{background:#ffffff12;color:#fff}.main{padding:28px;max-width:1500px;width:100%}h1{font:700 36px Georgia;color:var(--n);margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;color:var(--muted);font-size:12px}.stat b{display:block;font-size:28px;color:var(--n);margin-top:6px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 25px #06223a0a}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12px}th{background:#f7fafb;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px}.modal{position:fixed;inset:0;background:#041827c7;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}.modal.on{display:flex}.box{width:min(980px,100%);background:#fff;border-radius:20px;padding:24px;position:relative;margin:15px 0}.close{position:absolute;right:14px;top:8px;border:0;background:transparent;font-size:28px;color:var(--muted);cursor:pointer}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.notice{background:#eef6f8;border:1px solid #d9ebf0;padding:12px;border-radius:10px;color:#315e70;font-size:12px;margin-bottom:14px}.thumb{width:70px;height:50px;object-fit:cover;border-radius:7px}.check{display:flex;align-items:center;gap:8px}.switch{display:flex;align-items:center;gap:10px;background:#f7fafb;border:1px solid var(--line);padding:12px;border-radius:10px}.status-pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3f6;font-size:10px;font-weight:900}.status-new{background:#fff1d7;color:#76520c}.status-done{background:#e3f5e9;color:#23623b}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:4px}aside button{min-width:max-content;width:auto}.main{padding:16px}.grid2{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:550px){.stats{grid-template-columns:1fr 1fr}.top{padding:0 12px}.top img{height:45px}}
</style></head><body><div id="app"></div><script>
const A=document.getElementById('app');let editing=null,reviewPhoto='',countryEditing=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function loginPage(){A.innerHTML=`<div class="login"><form class="loginbox" onsubmit="login(event)"><img src="/logo.png"><h2>Admin Control Panel</h2><div class="field"><label>USERNAME</label><input id="u" value="admin"></div><div class="field"><label>PASSWORD</label><input id="p" type="password" required></div><button class="btn" style="width:100%">Login Securely</button></form></div>`}async function login(e){e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});if(r.ok)start();else alert('Invalid login')}async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(r.status===401){loginPage();throw Error('login')}return r.json()}
function start(){A.innerHTML=`<div class="top"><img src="/logo.png"><button class="btn" onclick="logout()">Logout</button></div><div class="layout"><aside><button onclick="dash()">📊 Dashboard</button><button onclick="settings()">⚙ Site Settings</button><button onclick="packs()">📦 Packages & Prices</button><button onclick="countries()">🌍 Countries</button><button onclick="books()">🧾 Bookings</button><button onclick="enqs()">💬 Enquiries</button><button onclick="reviews()">⭐ Testimonials</button></aside><main class="main" id="C"></main></div>`;dash()}
async function dash(){const d=await api('/api/admin/dashboard');C.innerHTML=`<h1>Dashboard</h1><div class="stats"><div class="stat">Countries<b>${d.countries}</b></div><div class="stat">Packages<b>${d.packages}</b></div><div class="stat">Bookings<b>${d.bookings}</b></div><div class="stat">Enquiries<b>${d.enquiries}</b></div><div class="stat">Reviews<b>${d.reviews||0}</b></div><div class="stat">Pending Reviews<b>${d.pendingReviews||0}</b></div></div><div class="panel" style="margin-top:18px"><div class="notice">This panel is now the main control centre. Homepage text, payment visibility, destinations, packages, bookings, enquiries and testimonials can be managed here.</div><button class="btn" onclick="settings()">Manage Website</button> <button class="btn dark" onclick="packs()">Manage Packages</button></div>`}
async function settings(){const s=await api('/api/admin/settings');const title=String(s.heroTitle||'Welcome to the World\nof\nVed Holidays');C.innerHTML=`<h1>Site Settings</h1><div class="panel"><div class="notice">Control the homepage from here. Use one line per hero line: Welcome to the World / of / Ved Holidays.</div><div class="field"><label>HOMEPAGE HERO TITLE — ONE LINE PER ROW</label><textarea id="st" rows="3">${esc(title.replace(/\\n/g,'\n'))}</textarea></div><div class="field"><label>HOMEPAGE HERO SUBTITLE</label><input id="ss" value="${esc(s.heroSub||'Chalo Duniya Ghum Aaye')}"></div><div class="switch"><input id="sp" type="checkbox" ${s.paymentVisible?'checked':''}><div><b>Show Payment Details on Homepage</b><div style="font-size:11px;color:#6b7f8c">Keep disabled when payment details should remain hidden until needed.</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2 style="margin:0 0 8px">Our Valued Partners</h2><div class="notice">Show/hide the partner section and change the partner name and logo anytime.</div><div class="switch"><input id="pv" type="checkbox" ${s.partnerVisible?'checked':''}><div><b>Show Our Valued Partners</b></div></div><div class="field"><label>PARTNER NAME</label><input id="pn" value="${esc(s.partnerName||'')}" placeholder="Partner name"></div><div class="field"><label>PARTNER LOGO — UPLOAD OR IMAGE URL</label><input id="pl" value="${esc(s.partnerLogo||'')}" placeholder="/partner-logo.png or image URL"><input id="plfile" type="file" accept="image/jpeg,image/png,image/webp" style="margin-top:8px"><small style="color:#6b7f8c">Upload a new logo to replace the current one. Optional.</small></div><button class="btn" style="margin-top:15px" onclick="saveSettings()">Save Website Settings</button></div>`}
async function saveSettings(){let logo=$('pl').value;const f=$('plfile')?.files[0];if(f){if(f.size>800*1024)return alert('Please choose a partner logo under 800 KB.');logo=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('Could not read logo'));r.readAsDataURL(f)})}await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({heroTitle:$('st').value,heroSub:$('ss').value,paymentVisible:$('sp').checked,partnerVisible:$('pv').checked,partnerName:$('pn').value,partnerLogo:logo})});alert('Website settings saved.');settings()}
async function packs(){const ps=await api('/api/admin/packages');C.innerHTML=`<h1>Packages & Prices</h1><div class="panel"><div class="toolbar"><b>${ps.length} packages</b><button class="btn" onclick="pkgForm()">+ Add Package</button></div><div class="table"><table><tr><th>Package</th><th>Country</th><th>Duration</th><th>Price</th><th>Active</th><th>Action</th></tr>${ps.map(p=>`<tr><td><b>${esc(p.title)}</b><br><small>${esc(p.short||'')}</small></td><td>${esc(p.country)}</td><td>${esc(p.duration)}</td><td>₹${Number(p.price).toLocaleString('en-IN')} / ${esc(p.unit)}</td><td>${p.active?'Yes':'No'}</td><td><button class="btn" onclick='pkgForm(${JSON.stringify(p)})'>Edit</button> <button class="btn red" onclick="delPkg(${p.id})">Delete</button></td></tr>`).join('')}</table></div></div>`}
function pkgForm(p={}){editing=p.id||null;document.body.insertAdjacentHTML('beforeend',`<div class="modal on" id="M"><div class="box"><button class="close" onclick="M.remove()">×</button><h2>${editing?'Edit':'Add'} Package</h2><div class="grid2"><div class="field"><label>TITLE</label><input id="pt" value="${esc(p.title)}"></div><div class="field"><label>COUNTRY SLUG</label><input id="pc" value="${esc(p.country||'thailand')}"></div><div class="field"><label>DURATION</label><input id="pd" value="${esc(p.duration)}"></div><div class="field"><label>PRICE</label><input id="pp" type="number" value="${p.price||''}"></div><div class="field"><label>UNIT</label><input id="pu" value="${esc(p.unit||'person')}"></div><div class="field"><label>IMAGE PATH / URL</label><input id="pi" value="${esc(p.image||'/thailand-hero.png')}"></div><div class="field full"><label>SHORT DESCRIPTION</label><textarea id="ps" rows="2">${esc(p.short||'')}</textarea></div><div class="field"><label>ACTIVE</label><select id="pac"><option value="true" ${p.active!==false?'selected':''}>Yes</option><option value="false" ${p.active===false?'selected':''}>No</option></select></div><div class="field"><label>FEATURED</label><select id="pf"><option value="true" ${p.featured?'selected':''}>Yes</option><option value="false" ${!p.featured?'selected':''}>No</option></select></div><div class="field full"><label>ITINERARY — ONE DAY PER LINE</label><textarea id="pit" rows="6">${esc((p.itinerary||[]).join('\n'))}</textarea></div><div class="field full"><label>ACCOMMODATION — Day range | Location | Hotel | Room | Meal</label><textarea id="pa" rows="5">${esc((p.accommodation||[]).map(a=>[a.day,a.location,a.hotel,a.room,a.meal].join(' | ')).join('\n'))}</textarea></div><div class="field full"><label>INCLUSIONS — ONE PER LINE</label><textarea id="pin" rows="4">${esc((p.inclusions||[]).join('\n'))}</textarea></div><div class="field full"><label>EXCLUSIONS — ONE PER LINE</label><textarea id="pex" rows="4">${esc((p.exclusions||[]).join('\n'))}</textarea></div></div><button class="btn" onclick="savePkg()">Save Package</button></div></div>`)}
async function savePkg(){const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean),acc=lines($('pa').value).map(x=>{const z=x.split('|').map(v=>v.trim());return{day:z[0]||'',location:z[1]||'',hotel:z[2]||'',room:z[3]||'',meal:z[4]||''}});const b={title:$('pt').value,country:$('pc').value,duration:$('pd').value,price:Number($('pp').value),unit:$('pu').value,image:$('pi').value,short:$('ps').value,active:$('pac').value==='true',featured:$('pf').value==='true',itinerary:lines($('pit').value),accommodation:acc,inclusions:lines($('pin').value),exclusions:lines($('pex').value)};await api(editing?'/api/admin/packages/'+editing:'/api/admin/packages',{method:editing?'PUT':'POST',body:JSON.stringify(b)});M.remove();packs()}
async function delPkg(id){if(confirm('Delete this package?')){await api('/api/admin/packages/'+id,{method:'DELETE'});packs()}}
async function countries(){const cs=await api('/api/admin/countries');C.innerHTML=`<h1>Countries & Destinations</h1><div class="panel"><div class="toolbar"><b>${cs.length} destinations</b><button class="btn" onclick="countryForm()">+ Add Country</button></div><div class="table"><table><tr><th>Country</th><th>Slug</th><th>Status</th><th>Description</th><th>Action</th></tr>${cs.map(c=>`<tr><td>${esc(c.flag)} ${esc(c.name)}</td><td>${esc(c.slug)}</td><td>${esc(c.status)}</td><td>${esc(c.description||'')}</td><td><button class="btn" onclick='countryForm(${JSON.stringify(c)})'>Edit</button> <button class="btn red" onclick="delCountry(${c.id})">Delete</button></td></tr>`).join('')}</table></div></div>`}
function countryForm(c={}){countryEditing=c.id||null;document.body.insertAdjacentHTML('beforeend',`<div class="modal on" id="CM"><div class="box"><button class="close" onclick="CM.remove()">×</button><h2>${countryEditing?'Edit':'Add'} Destination</h2><div class="grid2"><div class="field"><label>NAME</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>SLUG</label><input id="cs" value="${esc(c.slug)}" placeholder="thailand"></div><div class="field"><label>FLAG</label><input id="cf" value="${esc(c.flag||'🌍')}"></div><div class="field"><label>STATUS</label><select id="cst"><option value="active" ${c.status==='active'?'selected':''}>Active</option><option value="coming-soon" ${c.status==='coming-soon'?'selected':''}>Coming Soon</option></select></div><div class="field full"><label>IMAGE PATH / URL</label><input id="ci" value="${esc(c.image||'/thailand-hero.png')}"></div><div class="field full"><label>DESCRIPTION</label><textarea id="cd" rows="4">${esc(c.description||'')}</textarea></div></div><button class="btn" onclick="saveCountry()">Save Destination</button></div></div>`)}
async function saveCountry(){const b={name:$('cn').value,slug:$('cs').value,flag:$('cf').value,status:$('cst').value,image:$('ci').value,description:$('cd').value};await api(countryEditing?'/api/admin/countries/'+countryEditing:'/api/admin/countries',{method:countryEditing?'PUT':'POST',body:JSON.stringify(b)});CM.remove();countries()}
async function delCountry(id){if(confirm('Delete this destination and its packages?')){await api('/api/admin/countries/'+id,{method:'DELETE'});countries()}}
async function books(){const bs=await api('/api/admin/bookings');C.innerHTML=`<h1>Bookings</h1><div class="panel"><div class="table"><table><tr><th>Booking ID</th><th>Customer</th><th>Package</th><th>Date</th><th>Status</th><th>Confirmation</th><th>Action</th></tr>${bs.map(b=>`<tr><td><b>${esc(b.bookingId||('VH'+String(b.id).padStart(5,'0')))}</b></td><td>${esc(b.name)}<br>${esc(b.phone)}</td><td>${esc(b.package)}</td><td>${esc(b.date)}</td><td><span class="status-pill">${esc(b.status||'pending')}</span>${b.confirmedAt?'<br><small>Confirmed '+new Date(b.confirmedAt).toLocaleString()+'</small>':''}</td><td>${b.status==='confirmed'?'<b style="color:#23623b">✓ Customer can see confirmation</b>':'<button class="btn" onclick="confirmBook('+b.id+')">Confirm Booking</button>'}</td><td><select onchange="updateBook(${b.id},this.value)"><option value="pending" ${b.status==='pending'?'selected':''}>Pending</option><option value="confirmed" ${b.status==='confirmed'?'selected':''}>Confirmed</option><option value="completed" ${b.status==='completed'?'selected':''}>Completed</option><option value="cancelled" ${b.status==='cancelled'?'selected':''}>Cancelled</option></select></td></tr>`).join('')}</table></div></div>`}
async function confirmBook(id){const note=prompt('Optional confirmation note for customer:', 'Your booking is confirmed by Ved Holidays.');if(note===null)return;await api('/api/admin/bookings/'+id,{method:'PUT',body:JSON.stringify({status:'confirmed',confirmationNote:note})});books()} async function updateBook(id,status){let body={status};if(status==='confirmed'){body.confirmationNote=prompt('Optional confirmation note for customer:','Your booking is confirmed by Ved Holidays.')||'Your booking is confirmed by Ved Holidays.'}await api('/api/admin/bookings/'+id,{method:'PUT',body:JSON.stringify(body)});books()}
async function enqs(){const qs=await api('/api/admin/enquiries');C.innerHTML=`<h1>Customer Enquiries</h1><div class="panel"><div class="table"><table><tr><th>Date</th><th>Name</th><th>Phone</th><th>Country</th><th>Message</th><th>Status</th></tr>${qs.map(q=>`<tr><td>${new Date(q.createdAt).toLocaleString()}</td><td>${esc(q.name)}</td><td>${esc(q.phone)}</td><td>${esc(q.country)}</td><td>${esc(q.message)}</td><td><select onchange="updateEnq(${q.id},this.value)"><option value="new" ${q.status==='new'?'selected':''}>New</option><option value="contacted" ${q.status==='contacted'?'selected':''}>Contacted</option><option value="closed" ${q.status==='closed'?'selected':''}>Closed</option></select></td></tr>`).join('')}</table></div></div>`}
async function updateEnq(id,status){await api('/api/admin/enquiries/'+id,{method:'PUT',body:JSON.stringify({status})});enqs()}
async function reviews(){const rs=await api('/api/admin/reviews');C.innerHTML=`<h1>Testimonials & Customer Feedback</h1><div class="panel"><div class="notice">Customer feedback submitted from the homepage stays pending until you approve it. Approved reviews appear in the homepage carousel.</div><div class="toolbar"><b>${rs.length} reviews</b><button class="btn" onclick="reviewForm()">+ Add Review</button></div><div class="table"><table><tr><th>Name</th><th>Destination</th><th>Rating</th><th>Review</th><th>Photo</th><th>Published</th><th>Action</th></tr>${rs.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.country)}</td><td>${x.rating||5}/5</td><td>${esc(x.text)}</td><td>${x.photo?`<img class="thumb" src="${esc(x.photo)}">`:'—'}</td><td>${x.published!==false?'Yes':'No'}</td><td><button class="btn" onclick='reviewForm(${JSON.stringify(x)})'>Edit / Approve</button> <button class="btn red" onclick="delReview(${x.id})">Delete</button></td></tr>`).join('')}</table></div></div>`}
function reviewForm(x={}){editing=x.id||null;reviewPhoto=x.photo||'';document.body.insertAdjacentHTML('beforeend',`<div class="modal on" id="RM"><div class="box"><button class="close" onclick="RM.remove()">×</button><h2>${editing?'Edit / Approve':'Add'} Testimonial</h2><div class="grid2"><div class="field"><label>NAME</label><input id="rn" value="${esc(x.name)}"></div><div class="field"><label>DESTINATION</label><input id="rc" value="${esc(x.country||'Thailand')}"></div><div class="field"><label>RATING</label><input id="rr" type="number" min="1" max="5" value="${x.rating||5}"></div><div class="field"><label>PUBLISHED</label><select id="rp"><option value="true" ${x.published!==false?'selected':''}>Yes — show on website</option><option value="false" ${x.published===false?'selected':''}>No — keep hidden</option></select></div><div class="field full"><label>TRIP PHOTO (OPTIONAL)</label><input id="rphoto" type="file" accept="image/jpeg,image/png,image/webp"><small style="color:#6b7f8c">Existing photo remains if no new photo is selected.</small></div><div class="field full"><label>REVIEW</label><textarea id="rt" rows="5">${esc(x.text||'')}</textarea></div></div><button class="btn" onclick="saveReview()">Save & Approve</button></div></div>`)}
async function saveReview(){let photo=reviewPhoto;const f=$('rphoto')?.files[0];if(f){if(f.size>2*1024*1024)return alert('Please choose a photo under 2 MB.');photo=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('Could not read photo'));r.readAsDataURL(f)})}const b={name:$('rn').value,country:$('rc').value,rating:Number($('rr').value),text:$('rt').value,published:$('rp').value==='true',verified:true,photo};await api(editing?'/api/admin/reviews/'+editing:'/api/admin/reviews',{method:editing?'PUT':'POST',body:JSON.stringify(b)});RM.remove();reviews()}
async function delReview(id){if(confirm('Delete this review?')){await api('/api/admin/reviews/'+id,{method:'DELETE'});reviews()}}async function logout(){await fetch('/api/admin/logout',{method:'POST'});loginPage()}fetch('/api/admin/me').then(r=>r.ok?start():loginPage());
</script></body></html>
